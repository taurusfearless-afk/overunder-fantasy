<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OverUnder Admin</title><link rel="stylesheet" href="style.css"><style>.admin{padding:28px 0 60px}.admin h1{font-family:'Bebas Neue',sans-serif;font-size:56px;color:var(--gold2);margin:0}.admin textarea{width:100%;min-height:520px;background:#080808;color:#eee;border:1px solid var(--line);border-radius:14px;padding:16px;font:13px/1.5 Consolas,monospace}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid var(--line);background:#111;color:#fff;padding:11px 15px;border-radius:10px;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#e6bd57,#9b6b1d);color:#0a0a0a;font-weight:800}.small{color:#aaa;font-size:13px;line-height:1.5}.ok{color:#63e79a}.bad{color:#ff8383}</style></head><body><div class="container admin"><a href="index.html#/home" style="color:var(--gold2)">← Nazad na sajt</a><h1>OVERUNDER ADMIN</h1><p class="small">Menjaj podatke u JSON-u, pregledaj lokalno, pa preuzmi novi <b>data.js</b>. Na hostingu menjaš samo taj jedan fajl.</p><div class="actions"><button class="btn primary" id="preview">Pregledaj lokalno</button><button class="btn" id="download">Preuzmi data.js</button><button class="btn" id="reset">Vrati originalne podatke</button></div><div id="msg" class="small"></div><textarea id="editor"></textarea></div><script src="data.js"></script><script>
const ed=document.getElementById('editor'),msg=document.getElementById('msg');ed.value=JSON.stringify(window.OVERUNDER_DATA,null,2);function parse(){try{const d=JSON.parse(ed.value);msg.innerHTML='<span class="ok">JSON je ispravan.</span>';return d}catch(e){msg.innerHTML='<span class="bad">Greška: '+e.message+'</span>';return null}}document.getElementById('preview').onclick=()=>{const d=parse();if(!d)return;localStorage.setItem('overunder_data_override',JSON.stringify(d));window.open('index.html#/home','_blank')};document.getElementById('reset').onclick=()=>{localStorage.removeItem('overunder_data_override');ed.value=JSON.stringify(window.OVERUNDER_DATA,null,2);msg.textContent='Lokalne izmene su obrisane.'};document.getElementById('download').onclick=()=>{const d=parse();if(!d)return;const content='window.OVERUNDER_DATA = '+JSON.stringify(d,null,2)+';\n';const blob=new Blob([content],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.js';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
