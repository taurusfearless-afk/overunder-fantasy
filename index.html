  <style>
    .ou-rotate-hint{display:none!important}
    #ouRotateV60{position:fixed;right:14px;bottom:max(18px,env(safe-area-inset-bottom));z-index:9999;display:none;align-items:center;justify-content:center;width:52px;height:52px;padding:0;border:1.5px solid rgba(247,197,82,.82);border-radius:16px;background:rgba(7,7,7,.91);color:#ffc94f;box-shadow:0 5px 18px rgba(0,0,0,.5),0 0 13px rgba(255,190,54,.22);pointer-events:none;animation:ouV60Pulse 2.1s ease-in-out infinite}
    #ouRotateV60 svg{width:40px;height:40px;display:block;overflow:visible;filter:drop-shadow(0 0 4px rgba(255,197,73,.36))}
    body:has(.route-budget) #ouRotateV60,body:has(.route-double) #ouRotateV60{display:flex}
    @media(orientation:landscape){#ouRotateV60{display:none!important}}
    @media(max-width:390px){#ouRotateV60{right:11px;bottom:max(15px,env(safe-area-inset-bottom));width:50px;height:50px}#ouRotateV60 svg{width:38px;height:38px}}
    @keyframes ouV60Pulse{0%,100%{opacity:.64;transform:scale(.97)}50%{opacity:1;transform:scale(1.035);box-shadow:0 5px 18px rgba(0,0,0,.5),0 0 21px rgba(255,190,54,.38)}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ouRotateV60" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="19" y="25" width="29" height="19" rx="4.5"/>
      <circle cx="44.5" cy="34.5" r="1.25" fill="currentColor" stroke="none"/>
      <path d="M29.5 15.5C23.8 15.5 19.2 18.4 16.7 22.8"/>
      <path d="M16.7 22.8L13.2 19.8M16.7 22.8L19.6 19.2"/>
      <path d="M37.5 53C43.2 53 47.8 50.1 50.3 45.7"/>

  <script src="data.js?v=6.5.0"></script>
  <script src="script.js?v=6.5.0"></script>

  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=6.5.0',{scope:'./'}).catch(()=>{}));}
    window.addEventListener('load',()=>{
      if(window.matchMedia('(display-mode: standalone)').matches && screen.orientation){
        try{screen.orientation.unlock();}catch(e){}
        if(typeof screen.orientation.lock==='function'){
          try{screen.orientation.lock('any').catch(()=>{});}catch(e){}
        }
      }
    });
  </script>
