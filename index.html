<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OVERUNDER" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>OverUnder EuroLeague Fantasy 2026/27 · Premium V6.1</title>
  <link rel="manifest" href="manifest.webmanifest?v=5.7.0" />
  <link rel="icon" href="assets/icon-192.png.png?v=6.1.0" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/icon-192.png.png?v=6.1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6.1.0" />
  <link rel="stylesheet" href="premium-v3.css?v=6.1.0" />
  <style>
    .ou-rotate-hint{display:none!important}
    #ouRotateV60{position:fixed;right:18px;bottom:max(22px,env(safe-area-inset-bottom));z-index:9999;display:none;align-items:center;justify-content:center;width:88px;height:72px;padding:0;border:2px solid rgba(235,194,92,.78);border-radius:24px;background:rgba(7,7,7,.92);color:#f2c861;box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 24px rgba(226,182,77,.20);pointer-events:none;animation:ouV60Pulse 1.9s ease-in-out infinite}
    #ouRotateV60 .phone{position:relative;width:52px;height:30px;border:4px solid currentColor;border-radius:7px;box-sizing:border-box;filter:drop-shadow(0 0 6px rgba(242,200,97,.32))}
    #ouRotateV60 .phone:before{content:'';position:absolute;right:3px;top:50%;width:3px;height:3px;border-radius:50%;background:currentColor;transform:translateY(-50%)}
    #ouRotateV60 .arrow{position:absolute;font-size:31px;line-height:1;font-weight:400;right:4px;bottom:0;transform:rotate(-25deg)}
    body:has(.route-budget) #ouRotateV60,body:has(.route-double) #ouRotateV60{display:flex}
    @media(orientation:landscape){#ouRotateV60{display:none!important}}
    @media(max-width:390px){#ouRotateV60{right:12px;bottom:max(16px,env(safe-area-inset-bottom));width:82px;height:68px}#ouRotateV60 .phone{width:50px;height:29px}}
    @keyframes ouV60Pulse{0%,100%{opacity:.58;transform:scale(.96)}50%{opacity:1;transform:scale(1.07);box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 34px rgba(226,182,77,.38)}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ouRotateV60" aria-hidden="true"><span class="phone"></span><span class="arrow">↻</span></div>
  <script src="data.js?v=6.1.0"></script>
  <script src="script.js?v=6.1.0"></script>
  <script src="v33.js?v=5.9.1"></script>
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=6.1.0',{scope:'./'}).catch(()=>{}));}
    window.addEventListener('load',()=>{
      if(window.matchMedia('(display-mode: standalone)').matches && screen.orientation){
        try{screen.orientation.unlock();}catch(e){}
        if(typeof screen.orientation.lock==='function'){
          try{screen.orientation.lock('any').catch(()=>{});}catch(e){}
        }
      }
    });
  </script>
</body>
</html>
