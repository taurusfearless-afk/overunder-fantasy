  <style>
    .ou-rotate-hint{display:none!important}
    #ouRotateV60{position:fixed;right:14px;bottom:max(18px,env(safe-area-inset-bottom));z-index:9999;display:none;align-items:center;justify-content:center;width:58px;height:58px;padding:0;border:1.4px solid rgba(235,194,92,.72);border-radius:18px;background:rgba(7,7,7,.91);color:#f2c861;box-shadow:0 6px 22px rgba(0,0,0,.48),0 0 15px rgba(226,182,77,.17);pointer-events:none;animation:ouV60Pulse 2.1s ease-in-out infinite}
    #ouRotateV60 svg{width:43px;height:43px;display:block;overflow:visible;filter:drop-shadow(0 0 4px rgba(242,200,97,.30))}
    body:has(.route-budget) #ouRotateV60,body:has(.route-double) #ouRotateV60{display:flex}
    @media(orientation:landscape){#ouRotateV60{display:none!important}}
    @media(max-width:390px){#ouRotateV60{right:11px;bottom:max(15px,env(safe-area-inset-bottom));width:56px;height:56px}#ouRotateV60 svg{width:41px;height:41px}}
    @keyframes ouV60Pulse{0%,100%{opacity:.64;transform:scale(.97)}50%{opacity:1;transform:scale(1.035);box-shadow:0 6px 22px rgba(0,0,0,.48),0 0 23px rgba(226,182,77,.32)}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ouRotateV60" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="19" y="23" width="30" height="20" rx="4.5"/>

  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=6.4.0',{scope:'./'}).catch(()=>{}));}
    window.addEventListener('load',()=>{
      if(window.matchMedia('(display-mode: standalone)').matches && screen.orientation){
        try{screen.orientation.unlock();}catch(e){}
        if(typeof screen.orientation.lock==='function'){
          try{screen.orientation.lock('any').catch(()=>{});}catch(e){}
        }
      }
    });
  </script>
