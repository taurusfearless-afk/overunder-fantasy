  <style>
    .ou-rotate-hint{display:none!important}
    #ouRotateV60{position:fixed;right:14px;bottom:max(18px,env(safe-area-inset-bottom));z-index:9999;display:none;align-items:center;justify-content:center;width:50px;height:50px;padding:0;border:1.35px solid rgba(255,205,92,.86);border-radius:15px;background:rgba(5,5,5,.92);color:#ffd05c;box-shadow:0 5px 17px rgba(0,0,0,.48),0 0 12px rgba(255,190,54,.22);pointer-events:none;animation:ouV60Pulse 2.15s ease-in-out infinite}
    #ouRotateV60 svg{width:39px;height:39px;display:block;overflow:visible;filter:drop-shadow(0 0 3px rgba(255,197,73,.34))}
    body:has(.route-budget) #ouRotateV60,body:has(.route-double) #ouRotateV60{display:flex}
    @media(orientation:landscape){#ouRotateV60{display:none!important}}
    @media(max-width:390px){#ouRotateV60{right:11px;bottom:max(15px,env(safe-area-inset-bottom));width:49px;height:49px}#ouRotateV60 svg{width:38px;height:38px}}
    @keyframes ouV60Pulse{0%,100%{opacity:.66;transform:scale(.98)}50%{opacity:1;transform:scale(1.035);box-shadow:0 5px 17px rgba(0,0,0,.48),0 0 20px rgba(255,190,54,.36)}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ouRotateV60" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="20" y="25" width="29" height="19" rx="4.2"/>
      <circle cx="45.5" cy="34.5" r="1.15" fill="currentColor" stroke="none"/>
      <path d="M30 16C24.2 16 19.4 18.8 16.8 23.4"/>
      <path d="M16.8 23.4L13.2 20.3L13.9 26.2Z" fill="currentColor" stroke="none"/>
      <path d="M38 53C43.8 53 48.6 50.2 51.2 45.6"/>
      <path d="M51.2 45.6L54.8 48.7L54.1 42.8Z" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <script src="data.js?v=6.6.0"></script>
  <script src="script.js?v=6.6.0"></script>
  <script src="v33.js?v=5.9.1"></script>
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=6.6.0',{scope:'./'}).catch(()=>{}));}
    window.addEventListener('load',()=>{
      if(window.matchMedia('(display-mode: standalone)').matches && screen.orientation){
        try{screen.orientation.unlock();}catch(e){}
        if(typeof screen.orientation.lock==='function'){
          try{screen.orientation.lock('any').catch(()=>{});}catch(e){}
        }
      }
    });
  </script>
