  <style>
    .ou-rotate-hint{display:none!important}
    #ouRotateV60{position:fixed;right:16px;bottom:max(20px,env(safe-area-inset-bottom));z-index:9999;display:none;align-items:center;justify-content:center;width:72px;height:62px;padding:0;border:1.5px solid rgba(235,194,92,.72);border-radius:20px;background:rgba(7,7,7,.90);color:#f2c861;box-shadow:0 7px 25px rgba(0,0,0,.50),0 0 18px rgba(226,182,77,.18);pointer-events:none;animation:ouV60Pulse 2s ease-in-out infinite}
    #ouRotateV60 svg{width:52px;height:42px;display:block;overflow:visible;filter:drop-shadow(0 0 5px rgba(242,200,97,.30))}
    body:has(.route-budget) #ouRotateV60,body:has(.route-double) #ouRotateV60{display:flex}
    @media(orientation:landscape){#ouRotateV60{display:none!important}}
    @media(max-width:390px){#ouRotateV60{right:12px;bottom:max(16px,env(safe-area-inset-bottom));width:68px;height:58px}#ouRotateV60 svg{width:49px;height:39px}}
    @keyframes ouV60Pulse{0%,100%{opacity:.62;transform:scale(.97)}50%{opacity:1;transform:scale(1.045);box-shadow:0 7px 25px rgba(0,0,0,.50),0 0 27px rgba(226,182,77,.34)}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ouRotateV60" aria-hidden="true">
    <svg viewBox="0 0 64 50" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="17" y="14" width="30" height="21" rx="4.5"/>

  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=6.3.0',{scope:'./'}).catch(()=>{}));}
    window.addEventListener('load',()=>{
      if(window.matchMedia('(display-mode: standalone)').matches && screen.orientation){
        try{screen.orientation.unlock();}catch(e){}
        if(typeof screen.orientation.lock==='function'){
          try{screen.orientation.lock('any').catch(()=>{});}catch(e){}
        }
      }
    });
  </script>
